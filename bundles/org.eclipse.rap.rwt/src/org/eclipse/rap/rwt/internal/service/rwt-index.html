<!DOCTYPE html>
<html>
  <head>
    <title>${title}</title>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- No maximum-scale: pinch to zoom is how a page is read on a small screen, and taking it
         away is a barrier for anyone who needs to enlarge the text -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" >
    <!-- Lets the browser draw its own parts - form controls, scrollbars, the canvas behind the
         page - in the same appearance the theme is using -->
    <meta name="color-scheme" content="light dark" >
    ${headers}
    <!-- Default presentation for supported markup elements. Every style block carries the nonce, so
         that a content security policy can leave out 'unsafe-inline' for style elements -->
    <style type="text/css" nonce="${nonceValue}">
      big {
        font-size: 1.2em;
      }
      small, sup, sub {
        font-size: 0.8em;
      }
      q:before, q:after {
        content: "";
      }
      b, strong {
        font-weight: 700;
      }
      i, em, var, cite, dfn {
        font-style: italic;
      }
      ins {
        text-decoration: underline;
      }
      del {
        text-decoration: line-through;
      }
      code, samp, kbd {
        font-family: "Courier New", Courier, "Nimbus Mono L", monospace;
      }
      abbr {
        border-bottom: 1px dotted;
      }
      .rwt-cell-selectable {
        cursor: pointer;
      }
      .rwt-cell-selectable:hover {
        text-decoration: underline;
      }
    </style>
    <!-- Hide native scrollbars -->
    <style type="text/css" nonce="${nonceValue}">
      div::-webkit-scrollbar {
        width: 0px;
        height: 0px;
      }
      div {
        scrollbar-width: none;
      }
    </style>
    <!-- Page background and messages: here rather than in style attributes, which a nonce cannot
         cover -->
    <style type="text/css" nonce="${nonceValue}">
      body {
        background: url( '${backgroundImage}' );
      }
      .rwt-page-message {
        z-index: 100000;
        background-color: white;
      }
    </style>
  </head>

  <body>
    <noscript>
      <p class="rwt-page-message">
        ${noScriptMessage}
      </p>
    </noscript>

    <!-- BODY_HTML -->
${body}
    <!-- /BODY_HTML -->

${libraries}

    <div id="rwt-unsupported" hidden>
      <p class="rwt-page-message">
        ${noScriptMessage}
      </p>
    </div>

    <script type="text/javascript" nonce="${nonceValue}">
      if( rwt.runtime.System.getInstance().isSupported() ) {
        ${appScript}
      } else {
        document.getElementById( "rwt-unsupported" ).hidden = false;
      }
    </script>
  </body>
</html>
